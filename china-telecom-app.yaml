name: "中国电信 App 版"
description: "App 三步登录链（服务密码→ticket→统一登录）查话费/流量/语音，无需 cookie；独立模块"
author: "小龙女她爸"

# 模块设置页
env_schema:
  CT_APP_PHONE:
    name: 手机号
    description: 11 位电信手机号
  CT_APP_PASSWORD:
    name: 服务密码
    description: 电信服务密码（非短信验证码）
  CT_APP_ANDROID_ID:
    name: AndroidID
    description: 16 位十六进制设备 ID，从辅助网站短信登录获取一次填入即可
  CT_SHOW_USED_FLOW:
    name: 显示已用流量
    description: 打开后流量卡显示已用而非剩余
    options:
      - "true"
      - "false"
  CT_TITLE:
    name: 小组件标题
    description: 默认"中国电信"，可自定义

scriptings:
  - generic:
      name: "china-telecom-app"
      script_url: "https://raw.githubusercontent.com/SIJULY/egern-radar/main/china-telecom-app.js"
      timeout: 30

widgets:
  - name: "中国电信 App"
    script_name: "china-telecom-app"
