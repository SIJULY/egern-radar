name: "中国电信"
description: "显示电信剩余话费 / 剩余（或已用）流量 / 剩余语音"
author: "小秘书"

scriptings:
  - generic:
      name: "china-telecom"
      # raw 链接（与本仓库 china-telecom.js 对应）
      script_url: "https://raw.githubusercontent.com/SIJULY/egern-radar/main/china-telecom.js"
      timeout: 20

widgets:
  - name: "china-telecom"
    env:
      # 电信登录地址（抓包得到的登录 URL，用于自动更新 cookie），必填其一
      CT_LOGIN_URL: ""
      # 也可直接填写抓到的 cookie（与 CT_LOGIN_URL 二选一）
      # CT_COOKIE: ""
      # 'true' 显示已用流量，否则显示剩余流量
      # CT_SHOW_USED_FLOW: "false"
      # 'true' 过滤定向流量
      # CT_FILTER_ORIENTATE_FLOW: "false"
      # 小组件标题
      # CT_TITLE: "中国电信"
