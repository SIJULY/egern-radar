name: "中国电信"
description: "显示电信剩余话费 / 剩余（或已用）流量 / 剩余语音；在 Safari 打开 https://e.dlife.cn 短信登录一次，之后全自动更新"
author: "小秘书"

# 捕获登录请求需要解密 e.dlife.cn 的 HTTPS 流量（需信任 Egern 证书）
mitm:
  hostnames:
    includes:
      - e.dlife.cn

scriptings:
  # 小组件脚本（generic 类型）
  - generic:
      name: "china-telecom"
      script_url: "https://raw.githubusercontent.com/SIJULY/egern-radar/main/china-telecom.js"
      timeout: 20
  # 登录捕获（http_request 类型，与小组件是同一个文件，脚本内部按 ctx.request 自动分支）
  # Safari 里登录 e.dlife.cn 成功后，直接从登录后的真实请求里抓 Cookie 存入存储，
  # 小组件优先用抓到的 Cookie，全程无需手动操作
  - http_request:
      name: "中国电信登录捕获"
      match: '^https://e\.dlife\.cn/'
      script_url: "https://raw.githubusercontent.com/SIJULY/egern-radar/main/china-telecom.js"
      timeout: 10

widgets:
  # 与同名 generic 脚本自动关联；登录地址由捕获脚本自动存入存储，无需手动配置 Env
  - name: "china-telecom"
    # 高级选项（一般不用动）：
    # env:
    #   CT_SHOW_USED_FLOW: "false"        # 'true' 显示已用流量，否则显示剩余流量
    #   CT_FILTER_ORIENTATE_FLOW: "false" # 'true' 过滤定向流量
    #   CT_TITLE: "中国电信"               # 小组件标题
    #   CT_WIDGET_STYLE: "glass"          # 'classic' 卡片实底色（默认）；'glass' 卡片半透明，透出系统磨砂
    #   CT_LOGIN_URL: ""                  # 手动指定登录地址（自动捕获失败时的备用）
    #   CT_COOKIE: ""                     # 直接填写 cookie（备用）
