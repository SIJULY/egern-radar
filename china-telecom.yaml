name: "中国电信"
description: "显示电信剩余话费 / 剩余（或已用）流量 / 剩余语音；在 Safari 打开 https://e.dlife.cn 短信登录一次，之后全自动更新"
author: "小秘书"

# 模块设置页自动生成的 UI 控件（options 为 ["true","false"] 时生成开关）
env_schema:
  CT_GLASS:
    name: 半透明效果
    description: 打开后卡片半透明，透出 iOS 系统磨砂背景
    options:
      - "true"
      - "false"
  CT_SHOW_DIRECT:
    name: 显示定向流量卡
    description: 关闭后隐藏定向卡片，变为三卡模式；不设置则按是否有定向数据自动判断
    options:
      - "true"
      - "false"
  CT_SHOW_USED_FLOW:
    name: 显示已用流量
    description: 打开后流量卡显示已用而非剩余
    options:
      - "true"
      - "false"
  CT_TITLE:
    name: 小组件标题
    description: 显示的标题文字
    default_value: "中国电信"

# 捕获登录请求需要解密 e.dlife.cn 的 HTTPS 流量（需信任 Egern 证书）
mitm:
  hostnames:
    includes:
      - e.dlife.cn

scriptings:
  # 小组件脚本（generic 类型）
  - generic:
      name: "china-telecom"
      script_url: "https://raw.githubusercontent.com/SIJULY/egern-radar/main/china-telecom.js"
      timeout: 20
  # 登录捕获（http_request 类型，与小组件是同一个文件，脚本内部按 ctx.request 自动分支）
  # Safari 里登录 e.dlife.cn 成功后，直接从登录后的真实请求里抓 Cookie 存入存储，
  # 小组件优先用抓到的 Cookie，全程无需手动操作
  - http_request:
      name: "中国电信登录捕获"
      match: '^https://e\.dlife\.cn/'
      script_url: "https://raw.githubusercontent.com/SIJULY/egern-radar/main/china-telecom.js"
      timeout: 10

widgets:
  # 小组件在 iOS「编辑小组件」列表里显示为「中国电信」，通过 script_name 关联 generic 脚本
  - name: "中国电信"
    script_name: "china-telecom"
    # 高级选项（一般不用动），也可在模块设置页的开关/输入框里改：
    # env:
