name: 中国天气小组件
description: 中国天气网 实况7天预报/生活指数，无需 Key
author: 小龙女她爸
icon: https://raw.githubusercontent.com/SIJULY/egern-radar/main/weather-icon.png
compat_arguments:
  weatherCity: ''
  weatherUserName: ''
compat_arguments_schema:
  weatherCity:
    name: 城市
    description: 要查询的城市，例如 合肥、北京、海口；留空或填"自动"则按 IP 自动定位（模块自带直连规则）
    default_value: ''
  weatherUserName:
    name: 名字
    description: 大尺寸问候语显示的名字，可不填
    default_value: ''
dns: {}
# 天气/IP 定位接口直连，不走代理（否则 IP 定位到代理出口）
rules:
  - domain_suffix:
      match: "ipapi.co"
      policy: DIRECT
  - domain_suffix:
      match: "freeipapi.com"
      policy: DIRECT
  - domain_suffix:
      match: "weather.com.cn"
      policy: DIRECT
scriptings:
- generic:
    name: weathercn
    script_url: https://raw.githubusercontent.com/SIJULY/egern-radar/main/WeatherWdg.js
    env:
      CITY: '{{{weatherCity}}}'
      USER_NAME: '{{{weatherUserName}}}'
widgets:
- name: weathercn
  script_name: weathercn
