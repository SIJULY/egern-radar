name: "Spotify 去广告"
description: "转自 devchristian1337/loon-plugins（2026-10-08），脚本已转写为 Egern 格式：去广告 + 解锁部分高级功能。附带屏蔽 Spotify QUIC/UDP 规则，可修复新版随机断播跳歌。启用后需重新登录 Spotify。protobuf 补丁默认只启用本地版（spot-proto-ev3，作者推荐），远程版（eevee）按作者要求未包含、不要与本地版同时开。"
author: "devchristian1337（Egern 适配）"
homepage: "https://github.com/devchristian1337/loon-plugins"
icon: "https://raw.githubusercontent.com/devchristian1337/loon-plugins/refs/heads/main/App-Icons/spotify.png"

rules:
  # 对应 lpx：AND,((DOMAIN-SUFFIX,spotify.com),(PROTOCOL,QUIC)),REJECT
  # Egern 的 protocol 规则只支持 udp；QUIC 跑在 UDP 上，拒掉 spotify.com 的 UDP 即逼音频回落 TCP
  - and:
      match:
        - domain_suffix:
            match: "spotify.com"
        - protocol:
            match: "udp"
      policy: REJECT
  - domain:
      match: "aet.spotify.com"
      policy: REJECT

header_rewrites:
  - delete:
      match: '^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/user-customization-service\/v1\/customize'
      name: if-none-match
      type: request

mitm:
  hostnames:
    includes:
      - spclient.wg.spotify.com
      - "*.spclient.spotify.com"

scriptings:
  - http_request:
      name: "Spotify gabo"
      match: '^https:\/\/(.*-spclient\.spotify\.com(:443)?|spclient\.wg\.spotify\.com)\/gabo-receiver-service'
      script_url: "https://raw.githubusercontent.com/SIJULY/egern-radar/main/spotify/spot-gabo.egern.js"
      timeout: 10
  # 以下四条对应 lpx 的 reject-dict：直接返回 200 空 JSON
  - http_request:
      name: "Spotify 屏蔽 pendragon"
      match: '^https:\/\/(spclient\.wg|.*-spclient)\.spotify\.com(:443)?\/pendragon'
      script_url: "https://raw.githubusercontent.com/SIJULY/egern-radar/main/spotify/spot-reject-dict.egern.js"
      timeout: 10
  - http_request:
      name: "Spotify 隐藏发现页"
      match: '^https:\/\/(spclient\.wg|.*-spclient)\.spotify\.com(:443)?\/watch-feed-entrypoints\/v.\/discovery-from-seed'
      script_url: "https://raw.githubusercontent.com/SIJULY/egern-radar/main/spotify/spot-reject-dict.egern.js"
      timeout: 10
  - http_request:
      name: "Spotify 隐藏会员信息"
      match: '^https:\/\/.*-spclient\.spotify\.com(:443)?\/pam-view-service\/'
      script_url: "https://raw.githubusercontent.com/SIJULY/egern-radar/main/spotify/spot-reject-dict.egern.js"
      timeout: 10
  - http_request:
      name: "Spotify 屏蔽 AI DJ"
      match: '37i9dQZF1EYkqdzj48dyYq'
      script_url: "https://raw.githubusercontent.com/SIJULY/egern-radar/main/spotify/spot-reject-dict.egern.js"
      timeout: 10
  - http_response:
      name: "Spotify 去搜索广告"
      match: '^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/browsita\/v.\/browse'
      script_url: "https://raw.githubusercontent.com/SIJULY/egern-radar/main/spotify/spot-NoSearchAd.egern.js"
      body_required: true
      timeout: 10
  - http_response:
      name: "Spotify 去首页广告"
      match: '^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/casita\/v.\/home\/'
      script_url: "https://raw.githubusercontent.com/SIJULY/egern-radar/main/spotify/spot-NoHomeAd.egern.js"
      body_required: true
      timeout: 10
  - http_response:
      name: "Spotify 去滚动广告"
      match: '^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/scrollsita\/v.\/scroll\/spotify'
      script_url: "https://raw.githubusercontent.com/SIJULY/egern-radar/main/spotify/spot-NoScrollAd.egern.js"
      body_required: true
      timeout: 10
  - http_response:
      name: "Spotify protobuf 本地补丁"
      match: '^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/(bootstrap\/v1\/bootstrap|user-customization-service\/v1\/customize)(\?.*)?$'
      script_url: "https://raw.githubusercontent.com/SIJULY/egern-radar/main/spotify/spot-proto-ev3.egern.js"
      body_required: true
      timeout: 10
