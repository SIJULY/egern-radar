name: 天气·晴雨
description: 蓝灰 UI 风格 · 含农历节气/逐时预报/五日预报/湿度进度条 · 数据源中国天气网（免 Key）
author: 小龙女她爸
icon: https://raw.githubusercontent.com/SIJULY/egern-radar/main/weather-icon.png

compat_arguments:
  QWEATHER_LOCATION: '自动'
compat_arguments_schema:
  QWEATHER_LOCATION:
    name: 位置
    description: 填“自动”按 IP 自动定位，或填中文城市名（如 合肥、北京、阳江）及 9 位天气网城市代码
    default_value: '自动'

env_schema:
  QWEATHER_LOCATION:
    name: 位置
    description: 填“自动”按 IP 自动定位，或填中文城市名（如 合肥、北京、阳江）及 9 位天气网城市代码
    default_value: '自动'

dns: {}

# 天气/IP 接口直连
rules:
  - domain_suffix:
      match: "ipapi.co"
      policy: DIRECT
  - domain_suffix:
      match: "freeipapi.com"
      policy: DIRECT
  - domain_suffix:
      match: "weather.com.cn"
      policy: DIRECT

scriptings:
- generic:
    name: qweather
    script_url: https://raw.githubusercontent.com/SIJULY/egern-radar/main/WeatherWdg.js
    timeout: 15
    env:
      QWEATHER_LOCATION: '{{{QWEATHER_LOCATION}}}'
widgets:
- name: 天气·晴雨
  script_name: qweather


