name: 和风天气·晴雨
description: 和风蓝灰 UI 风格 · 数据源中国天气网，无需 Key
author: 小龙女她爸
icon: https://raw.githubusercontent.com/SIJULY/egern-radar/main/weather-icon.png

env_schema:
  QWEATHER_LOCATION:
    name: 位置
    description: 城市名（如合肥）或经度,纬度（如 117.27,31.86）
    default_value: '合肥'

dns: {}

# 天气/IP 接口直连
rules:
  - domain_suffix:
      match: "ipapi.co"
      policy: DIRECT
  - domain_suffix:
      match: "freeipapi.com"
      policy: DIRECT
  - domain_suffix:
      match: "weather.com.cn"
      policy: DIRECT

scriptings:
- generic:
    name: qweather
    script_url: https://raw.githubusercontent.com/SIJULY/egern-radar/main/qweather.js
    env:
      QWEATHER_LOCATION: '{{{QWEATHER_LOCATION}}}'
widgets:
- name: qweather
  script_name: qweather
